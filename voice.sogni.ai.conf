upstream tts_backend {
    server 100.113.82.128:3000;
    keepalive 32;  # Persistent connections
}

server {
    listen 80;
    server_name voice.sogni.ai;

    client_max_body_size 100M;

    # TCP optimizations
    tcp_nodelay on;

    # Gzip compression for JSON and audio
    gzip on;
    gzip_types application/json audio/wav audio/mpeg audio/mp3;
    gzip_comp_level 5;
    gzip_min_length 1000;

    # Long-running clone generation: stream data as soon as possible to avoid edge timeout.
    location ~ ^/qwen-tts/voices/clone/[^/]+/generate$ {
        proxy_pass http://tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        send_timeout 600s;
    }

    # Native Parakeet realtime transcription. Keep the HTTP/1.1 upgrade
    # headers intact instead of clearing Connection as the REST proxy does.
    location = /v1/realtime/transcription {
        proxy_pass http://tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://tts_backend;
        proxy_http_version 1.1;

        # Required for keepalive
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering - accumulate response before sending
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # WebSocket endpoint (if needed)
    location /ws {
        proxy_pass http://tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
